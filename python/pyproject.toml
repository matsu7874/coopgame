[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "coopgame-py"
version = "0.1.1"
description = "TU 協力ゲームの仁・カーネル・Shapley 値などの計算と検証 (Rust 実装の Python バインディング)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["game-theory", "nucleolus", "cooperative-game", "shapley", "kernel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://github.com/matsu7874/coopgame"
Documentation = "https://github.com/matsu7874/coopgame/blob/main/python/README.md"

[tool.maturin]
module-name = "coopgame"
