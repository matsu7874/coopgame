[package]
name = "coopgame-py"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "coopgame の Python バインディング"
license = "MIT"
publish = false

[lib]
name = "coopgame_py"
crate-type = ["cdylib"]

[dependencies]
coopgame = { path = "..", features = ["io"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }

[profile.release]
lto = "thin"
codegen-units = 1
